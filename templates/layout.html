<!doctype html>
<html lang="en">

<head>

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CSS -->
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" crossorigin="anonymous"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.12.1/css/dataTables.bootstrap5.min.css" rel="stylesheet" crossorigin="anonymous">
    <title>{% block titulo %} {{ TITULO_SITIO }}{% endblock %}</title>
</head>
<body>
    <div class="container">
    <nav class="navbar navbar-expand-lg">
        <div class="container">
        <a class="navbar-brand" href="{% url 'index' %}">{{ DESCRIPCION_SITIO }}</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">

          
          </div>
        </div>
    {% block empresa %}
      <div class="col-md-6 text-end">
        {% for e in emp %}
        <p class='h6 m-5'>Empresa: {{ e.nombre }}</p>
        {% endfor %}
      </div>
    {% endblock %}      
            <div class="col-md-3 text-end">
              <a href="{% url 'salir' %}" class="btn btn-danger btn-sm">{{ user.nombre }} {{ user.apellidos}} <i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
          </nav>
          </div>

    {% block contenido %}
    {% endblock %}
  <div class="footer bg-light text-center text-lg-start mt-5">
    <div class="conteiner">
      <div class="container-fluid text-center">
        <a href='https://jltabbia.ar' target="_blank" style="text-decoration: none;">
          <p class="h6">José Luis Tabbia <i class="fa fa-copyright" aria-hidden="true"></i> 2026</p>
        </a>

      </div>
    </div>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <script src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.12.1/js/dataTables.bootstrap5.min.js"></script>    
    {% block js %}
    {% endblock %}
    
    
</div>
</body>
</html>
